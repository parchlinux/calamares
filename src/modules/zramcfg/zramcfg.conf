#
# zramcfg module — automatically configures zram-generator if no on-disk swap was chosen.
---
# Compression algorithm (e.g. zstd, lzo-rle, lz4)
algorithm: "zstd"

# Zram size expression for zram-generator (e.g. min(ram, 8192), ram / 2)
size: "min(ram, 8192)"
